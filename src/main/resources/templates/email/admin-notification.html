<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>신규 사물함 신청 알림</title>
</head>
<body style="margin:0; padding:0; background-color:#f3f5f9;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse; background-color:#f3f5f9;">
    <tr>
        <td align="center" style="padding:28px 12px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600"
                   style="border-collapse:separate; width:100%; max-width:600px; background-color:#ffffff; border:1px solid #e6eaf2; border-radius:14px; overflow:hidden;">

                <tr>
                    <td style="background-color:#0b2d5b; padding:22px 24px;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td style="vertical-align:middle;">
                                    <img src="https://raw.githubusercontent.com/The-Robinsons/FE/main/public/logos/mjuSWLogo.png" alt="사물함 관리 시스템"
                                         style="width:48px; height:48px; display:block;" />
                                </td>
                                <td style="padding-left:12px; vertical-align:middle; font-family:Arial,'Malgun Gothic',sans-serif; color:#ffffff;">
                                    <div style="font-size:18px; line-height:24px; font-weight:700;">신규 사물함 신청</div>
                                    <div style="font-size:13px; line-height:18px; opacity:0.9; padding-top:4px;">새로운 신청이 접수되었습니다</div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td style="padding:20px 24px;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                               style="border-collapse:separate; border:1px solid #fde68a; border-radius:12px; overflow:hidden; background-color:#fef3c7;">
                            <tr>
                                <td align="center" style="padding:16px 14px; font-family:Arial,'Malgun Gothic',sans-serif; font-size:14px; color:#78350f; font-weight:700;">
                                    신규 사물함 신청 알림
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td style="padding:0 24px 12px 24px;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                               style="border-collapse:separate; border:1px solid #e5e7eb; border-radius:12px; overflow:hidden; background-color:#f9fafb;">
                            <tr>
                                <td colspan="2" style="padding:14px 14px; background-color:#f3f4f6; border-bottom:1px solid #e5e7eb; font-family:Arial,'Malgun Gothic',sans-serif;">
                                    <span style="font-size:14px; line-height:20px; font-weight:700; color:#374151;">신청자 정보</span>
                                </td>
                            </tr>
                            <tr>
                                <td style="width:140px; padding:10px 14px; border-bottom:1px solid #e5e7eb; font-family:Arial,'Malgun Gothic',sans-serif; color:#6b7280; font-size:13px;">이름</td>
                                <td th:text="${applicantName}" style="padding:10px 14px; border-bottom:1px solid #e5e7eb; font-family:Arial,'Malgun Gothic',sans-serif; color:#111827; font-size:13px; font-weight:700;">홍길동</td>
                            </tr>
                            <tr>
                                <td style="width:140px; padding:10px 14px; border-bottom:1px solid #e5e7eb; font-family:Arial,'Malgun Gothic',sans-serif; color:#6b7280; font-size:13px;">학번</td>
                                <td th:text="${studentId}" style="padding:10px 14px; border-bottom:1px solid #e5e7eb; font-family:Arial,'Malgun Gothic',sans-serif; color:#111827; font-size:13px; font-weight:700;">20240001</td>
                            </tr>
                            <tr>
                                <td style="width:140px; padding:10px 14px; border-bottom:1px solid #e5e7eb; font-family:Arial,'Malgun Gothic',sans-serif; color:#6b7280; font-size:13px;">학년</td>
                                <td th:text="${grade}" style="padding:10px 14px; border-bottom:1px solid #e5e7eb; font-family:Arial,'Malgun Gothic',sans-serif; color:#111827; font-size:13px; font-weight:700;">3학년</td>
                            </tr>
                            <tr>
                                <td style="width:140px; padding:10px 14px; border-bottom:1px solid #e5e7eb; font-family:Arial,'Malgun Gothic',sans-serif; color:#6b7280; font-size:13px;">전공</td>
                                <td th:text="${major}" style="padding:10px 14px; border-bottom:1px solid #e5e7eb; font-family:Arial,'Malgun Gothic',sans-serif; color:#111827; font-size:13px; font-weight:700;">융합소프트웨어</td>
                            </tr>
                            <tr>
                                <td style="width:140px; padding:10px 14px; border-bottom:1px solid #e5e7eb; font-family:Arial,'Malgun Gothic',sans-serif; color:#6b7280; font-size:13px;">연락처</td>
                                <td th:text="${phone}" style="padding:10px 14px; border-bottom:1px solid #e5e7eb; font-family:Arial,'Malgun Gothic',sans-serif; color:#111827; font-size:13px; font-weight:700;">010-1234-5678</td>
                            </tr>
                            <tr>
                                <td style="width:140px; padding:10px 14px; font-family:Arial,'Malgun Gothic',sans-serif; color:#6b7280; font-size:13px;">이메일</td>
                                <td th:text="${email}" style="padding:10px 14px; font-family:Arial,'Malgun Gothic',sans-serif; color:#111827; font-size:13px; font-weight:700;">hong@example.com</td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td style="padding:0 24px 22px 24px;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                               style="border-collapse:separate; border:1px solid #dbe7ff; border-radius:12px; overflow:hidden; background-color:#f5f9ff;">
                            <tr>
                                <td colspan="2" style="padding:14px 14px; background-color:#eef5ff; border-bottom:1px solid #dbe7ff; font-family:Arial,'Malgun Gothic',sans-serif;">
                                    <span style="font-size:14px; line-height:20px; font-weight:700; color:#0b2d5b;">사물함 정보</span>
                                </td>
                            </tr>
                            <tr>
                                <td style="width:140px; padding:10px 14px; border-bottom:1px solid #dbe7ff; font-family:Arial,'Malgun Gothic',sans-serif; color:#6b7280; font-size:13px;">사물함 번호</td>
                                <td style="padding:10px 14px; border-bottom:1px solid #dbe7ff; font-family:Arial,'Malgun Gothic',sans-serif; color:#111827; font-size:13px; font-weight:700;">
                                    <span th:text="${lockerNumber}">2</span>번
                                </td>
                            </tr>
                            <tr>
                                <td style="width:140px; padding:10px 14px; border-bottom:1px solid #dbe7ff; font-family:Arial,'Malgun Gothic',sans-serif; color:#6b7280; font-size:13px;">신청 일시</td>
                                <td th:text="${appliedAt}" style="padding:10px 14px; border-bottom:1px solid #dbe7ff; font-family:Arial,'Malgun Gothic',sans-serif; color:#111827; font-size:13px; font-weight:700;">2026-02-16 11:30</td>
                            </tr>
                            <tr>
                                <td style="width:140px; padding:10px 14px; font-family:Arial,'Malgun Gothic',sans-serif; color:#6b7280; font-size:13px;">신청 비밀번호</td>
                                <td th:text="${lockerPassword}" style="padding:10px 14px; font-family:Arial,'Malgun Gothic',sans-serif; color:#111827; font-size:13px; font-weight:700;">123</td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td align="center" style="padding:16px 24px; background-color:#f7f9fc; border-top:1px solid #e6eaf2; font-family:Arial,'Malgun Gothic',sans-serif; color:#6b7280; font-size:12px; line-height:18px;">
                        <div style="font-weight:700; color:#374151;">사물함 관리 시스템</div>
                        <div>관리자 페이지에서 입금 확인 후 승인 처리해주세요.</div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
